{% extends 'base.html' %}
{% load static %}

{% block title %}Портфолио{% endblock %}

{% block content %}
<div class="container py-5">
    <h1 class="text-center mb-4">Мои работы</h1>
    <div class="row g-4">
        {% for work in works %}
        <div class="col-md-4 col-sm-6">
            <div class="card h-100 shadow-sm">
                <img src="{{ work.image.url }}" class="card-img-top" alt="{{ work.title }}" style="height: 250px; object-fit: cover;">
                <div class="card-body">
                    <h5 class="card-title">{{ work.title }}</h5>
                    <p class="card-text">{{ work.description|truncatewords:15 }}</p>
                </div>
            </div>
        </div>
        {% empty %}
        <div class="col-12 text-center">
            <p class="text-muted">Пока нет работ</p>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
