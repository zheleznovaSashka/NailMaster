meta:
  environment: python
  toolchain:
    name: pip
    version: 3.12

run:
  command: python manage.py collectstatic --noinput && python manage.py migrate && python manage.py loaddata data.json && gunicorn config.wsgi:application --bind 0.0.0.0:80 --worker-class gthread --workers 1 --threads 4 --timeout 60 --no-control-socket
  persistenceMount: /data
  containerPort: 80
