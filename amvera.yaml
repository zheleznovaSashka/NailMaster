meta:
  environment: python
  toolchain:
    name: pip
    version: 3.12

run:
  command: python manage.py collectstatic --noinput && python manage.py migrate && python manage.py loaddata data.json && gunicorn config.wsgi:application --bind 0.0.0.0:80 --timeout 60
  persistenceMount: /data
  containerPort: 80
