{% extends 'base.html' %}
{% load static %}

{% block title %}Удалить скрин{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card shadow">
                <div class="card-header bg-danger text-white">
                    <h3 class="mb-0">⚠️ Удаление скрина</h3>
                </div>
                <div class="card-body p-4 text-center">
                    <img src="{{ screenshot.image.url }}" alt="{{ screenshot.title }}"
                         style="max-width: 250px; border-radius: 10px; margin-bottom: 20px;">

                    <h4>Удалить этот скрин?</h4>
                    <p class="text-muted">Это действие нельзя отменить!</p>

                    <form method="post" class="mt-4">
                        {% csrf_token %}
                        <div class="d-flex gap-2 justify-content-center">
                            <button type="submit" class="btn btn-danger btn-lg">
                                🗑️ Да, удалить
                            </button>
                            <a href="{% url 'dashboard:screenshots_list' %}" class="btn btn-outline-secondary btn-lg">
                                ← Отмена
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
