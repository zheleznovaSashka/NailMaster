{% extends 'base.html' %}
{% load static %}

{% block title %}Заказ не найден{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card shadow text-center">
                <div class="card-body p-5">
                    <div class="display-1 mb-3">🔍</div>
                    <h2 class="mb-3">Заказ не найден</h2>
                    <p class="text-muted mb-4">
                        {% if order_id %}
                            Заказ <strong>#{{ order_id }}</strong> не найден.<br>
                        {% endif %}
                        Возможно, он был удалён или вы перешли по неверной ссылке.
                    </p>

                    <div class="d-flex gap-2 justify-content-center flex-wrap">
                        <a href="{% url 'dashboard:orders_list' %}" class="btn btn-primary">
                            ← Все заказы
                        </a>
                        <a href="{% url 'dashboard:home' %}" class="btn btn-outline-secondary">
                            На главную панели
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
